[alembic]
# Path to migration scripts, relative to this ini file (backend/alembic).
script_location = alembic

# Template used to generate migration file names. date-prefixed so `ls` on
# versions/ shows chronological order alongside the human-readable slug.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone used when rendering the `file_template` date fields. Leave blank
# for local time.
# timezone =

# Max length of characters to apply to the "slug" field.
truncate_slug_length = 40

# Set to 'true' to run the environment during the `revision` command,
# regardless of autogenerate.
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py file to be
# detected as revisions in the versions/ directory.
# sourceless = false

# Version path separator; As mentioned above, this is the character used to
# split version_locations.
version_path_separator = os

# NOTE: sqlalchemy.url is intentionally left blank. Eka's DB URL lives in
# backend/config.py (settings.DATABASE_URL, loaded from .env / the real
# environment) and is injected at runtime by alembic/env.py via
# config.set_main_option("sqlalchemy.url", ...). Do not hardcode a URL here.
sqlalchemy.url =

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run on newly
# generated revision scripts. None configured for Eka.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
# NOTE: single %, not doubled — this section is parsed by
# logging.config.fileConfig() via a RawConfigParser, which does not
# interpolate %-tokens (unlike the [alembic] section above, which is read
# by alembic's own interpolation-aware ConfigParser and does need %% here).
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
